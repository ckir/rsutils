[workspace]
members = ["apps/*", "libs/*"]
resolver = "3"

[workspace.package]
version = "0.4.0"
edition = "2024"
license = "MIT"
repository = "https://github.com/ckir/rsutils"
rust-version = "1.99"
authors = ["Costas Kirgoussios"]

[workspace.dependencies]
clap = { version = "4.6", features = ["derive"] }
anyhow = "1.0"
log = "0.4"
env_logger = "0.11"
assert_cmd = "2.2"
predicates = "3.1"
chrono = "0.4.45"
ignore = "0.4.33"
mlua = "0.12.0"
serde = "1.0.229"
serde_json = "1.0.151"
tantivy = "0.26.1"
jaq-core = "3.1.0"
jaq-std = "3.0.1"
jaq-json = "2.0.2"
termcolor = "1.4.1"
toml = "1.1.4"
tempfile = "3.27.0"
syn = "1"
quote = "1"
proc-macro2 = "1"

[workspace.lints.rust]
unsafe_code = "forbid"
missing_debug_implementations = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
