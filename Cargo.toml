[workspace]
members = ["apps/*", "libs/*"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"
repository = "https://github.com/ckir/rsutils"
rust-version = "1.99"
authors = ["Costas Kirgoussios"]

[workspace.dependencies]
clap = { version = "4.6", features = ["derive"] }
anyhow = "1.0"
log = "0.4"
env_logger = "0.11"
assert_cmd = "2.2"
predicates = "3.1"

[workspace.lints.rust]
unsafe_code = "forbid"
missing_debug_implementations = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
