[package]
name = "pore-core"
description = "Indexing and search engine behind pore"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
authors = ["Steven Arcangeli", "Costas Kirgoussios"]
publish = false

[dependencies]
anyhow = { workspace = true, features = ["backtrace"] }
chrono = { workspace = true, features = ["serde"] }
ignore.workspace = true
mlua = { workspace = true, features = ["async", "macros"] }
serde.workspace = true
serde_json.workspace = true
tantivy.workspace = true
macros = { package = "pore-macros", path = "../pore-macros" }
jaq-core.workspace = true
jaq-std.workspace = true
jaq-json = { workspace = true, features = ["serde"] }

[dev-dependencies]
tempfile.workspace = true

[features]
# On by default so `cargo test -p pore-core` builds on its own: mlua needs exactly one Lua
# version. Dependents that pick their own Lua (pore-lua) turn defaults off.
default = ["vendored"]
vendored = ["mlua/vendored", "mlua/lua55"]

[lints]
workspace = true
